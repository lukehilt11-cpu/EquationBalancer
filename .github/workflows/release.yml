name: Build, Release & Deploy Site

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0, no leading v)'
        required: true

# Only one site deploy at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --log-level ERROR balance_gui.spec
          New-Item -ItemType Directory -Force app | Out-Null
          Move-Item dist\EquationBalancer.exe app\

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/EquationBalancer_Setup.exe
          if-no-files-found: error

  build-macos:
    needs: prepare
    runs-on: macos-15          # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build .app with PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --log-level ERROR balance_gui.spec
          # ad-hoc sign so it runs on Apple Silicon
          codesign --force --deep --sign - dist/EquationBalancer.app

      - name: Package DMG
        run: |
          mkdir dmg
          cp -R dist/EquationBalancer.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Equation Balancer" -srcfolder dmg \
            -ov -format UDZO EquationBalancer-macOS-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: EquationBalancer-macOS-arm64.dmg
          if-no-files-found: error

  release:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Equation Balancer ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            ## Downloads
            - **Windows:** `EquationBalancer_Setup.exe` — installs to Start Menu / Apps & features
            - **macOS (Apple Silicon):** `EquationBalancer-macOS-arm64.dmg` — drag to Applications

            > Builds are unsigned. Windows: SmartScreen → *More info* → *Run anyway*.
            > macOS: right-click the app → *Open* the first time.
          files: |
            artifacts/windows/EquationBalancer_Setup.exe
            artifacts/macos/EquationBalancer-macOS-arm64.dmg

  pages:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fill in version, date and repo
        run: |
          sed -i \
            -e "s|__VERSION__|${{ needs.prepare.outputs.version }}|g" \
            -e "s|__DATE__|$(date -u +'%B %-d, %Y')|g" \
            -e "s|__REPO__|${{ github.repository }}|g" \
            site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
